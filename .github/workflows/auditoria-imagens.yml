name: Star Wars Explorer - testes e auditoria de imagens
on:
  push:
    branches: [work]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Executar todos os testes Node
        run: npm test
      - run: python -m pip install -r scripts/requirements-audit.txt
      - name: Testar gerador de folhas de contato
        run: python tests/contact_sheets_test.py
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir disponibilidade de todos os retratos
        run: node scripts/audit-people-images.cjs
      - name: Instalar Pillow para auditoria visual
        if: ${{ always() && hashFiles('reports/people-images.csv') != '' }}
        run: python -m pip install -r scripts/requirements-audit.txt
      - name: Gerar folhas de contato dos personagens retornados
        if: ${{ always() && hashFiles('reports/people-images.csv') != '' }}
        run: python scripts/create-contact-sheets.py
      - name: Publicar CSV para inspeção manual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-imagens-personagens
          path: |
            reports/people-images.csv
            reports/visual-flags.csv
            reports/people-snapshot.json
            reports/image-metadata.csv
            reports/contact-sheets/*.jpg
          if-no-files-found: warn
